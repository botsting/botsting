name: tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "22"
      - run: python -m pip install -e . pytest ruff
      - run: python -m ruff check src tests examples
      - run: python -m pytest -q
      - run: node --test "js/harness/test/*.test.js"
  adapters:
    # The framework adapters fail closed only if each framework still dispatches tools the way the
    # adapter expects. These tests are skipped without the libraries, so this job installs them.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[agents,langchain,claude-agent,anthropic]" pytest
      - run: python -m pytest -q tests/test_harness_tools.py -rs
      - name: None of the adapter tests was skipped
        run: python -m pytest -q tests/test_harness_tools.py -rs | (! grep -q "SKIPPED")
      - name: The model connection works with the real SDK, with no key and no network
        run: python -m pytest -q tests/test_claude_model.py -rs | (! grep -q "SKIPPED")
  frameworks:
    # The drop-in harness on the real web frameworks. These tests are skipped without the libraries.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pytest flask quart fastapi
      - run: python -m pytest -q tests/test_harness_frameworks.py -rs
      - name: None of the framework tests was skipped
        run: python -m pytest -q tests/test_harness_frameworks.py -rs | (! grep -q "SKIPPED")
  practice-scan:
    # The action, run on the built-in practice bots: the vulnerable one must be caught and the
    # fixed one must come out clean. Nothing leaves the runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - id: vulnerable
        uses: ./
        with:
          target: toy:vulnerable
          fail-on: never
          report-dir: report-vulnerable
          upload: "false"
      - id: fixed
        uses: ./
        with:
          target: toy:fixed
          fail-on: inconclusive
          report-dir: report-fixed
          upload: "false"
      - name: The vulnerable bot was caught and the fixed one was not
        shell: bash
        env:
          VULNERABLE: ${{ steps.vulnerable.outputs.status }}
          FIXED: ${{ steps.fixed.outputs.status }}
        run: |
          test "$VULNERABLE" = "violations_verified"
          test "$FIXED" = "no_verified_violations"
