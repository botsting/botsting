[project]
name = "botsting"
version = "0.0.4"
description = "Evidence-first security testing for LLM applications: report what was proven, not what looked bad."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["httpx>=0.27"]
keywords = ["ai security", "llm", "agents", "red teaming", "prompt injection", "testing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://botsting.com"
Repository = "https://github.com/botsting/botsting"
Issues = "https://github.com/botsting/botsting/issues"
Changelog = "https://github.com/botsting/botsting/blob/main/CHANGELOG.md"

[project.optional-dependencies]
pyrit = ["pyrit>=1.2.0,<2"]
agents = ["openai-agents~=0.25.0"]
langchain = ["langchain-core~=1.8.4"]
claude-agent = ["claude-agent-sdk~=0.2.187"]
anthropic = ["anthropic>=2,<3"]

[project.scripts]
botsting = "botsting.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/botsting"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
# The rules the code is written to. Line length is checked by the formatter's width above, not as an error.
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501",    # width is the formatter's business
    "SIM102", "SIM105", "SIM117", "RUF005", "E731",  # rewrites that do not make this code clearer
    "RUF043", "RUF059", "B905",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F811", "E402"]  # pytest fixtures are passed by name; one test file sets up before importing
