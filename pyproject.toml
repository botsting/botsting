[project]
name = "promptproof"
version = "0.0.1"
description = "Evidence-first security testing for LLM applications: report what was proven, not what looked bad."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
pyrit = ["pyrit>=1.2.0,<2"]
agents = ["openai-agents~=0.25.0"]
langchain = ["langchain-core~=1.8.4"]
claude-agent = ["claude-agent-sdk~=0.2.187"]

[project.scripts]
promptproof = "promptproof.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/promptproof"]

[tool.pytest.ini_options]
testpaths = ["tests"]
